<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculator1.css">
</head>
<body>
    <center>
        <br>

    <div class="container">
        <input class="input" type="text" id="input">
        <button class="inner" id="Displaybtnvalues" onclick="Displaybtnvalues('/')">%</button>
        <button class="inner" id="clear">C</button>
        <button class="inner" id="delete">DEL</button>
        <button class="inner" onclick="Displaybtnvalues('/')">/</button>
        <button class="inner" onclick="Displaybtnvalues('1')">1</button>
        <button class="inner" onclick="Displaybtnvalues('2')">2</button>
        <button class="inner" onclick="Displaybtnvalues('3')">3</button>
        <button class="inner" onclick="Displaybtnvalues('+')">+</button>
        <button class="inner" onclick="Displaybtnvalues('4')">4</button>
        <button class="inner" onclick="Displaybtnvalues('5')">5</button>
        <button class="inner" onclick="Displaybtnvalues('6')">6</button>
        <button class="inner" onclick="Displaybtnvalues('-')">-</button>
        <button class="inner" onclick="Displaybtnvalues('7')">7</button>
        <button class="inner" onclick="Displaybtnvalues('8')">8</button>
        <button class="inner" onclick="Displaybtnvalues('9')">9</button>
        <button class="inner" onclick="Displaybtnvalues('*')">×</button>
        <button class="inner" onclick="Displaybtnvalues('0')">0</button>
        <button class="inner" onclick="Displaybtnvalues('00')">00</button>
        <button class="inner" onclick="Displaybtnvalues('.')">.</button>
        <button class="inner1" id="evual" onclick="calculate()">=</button>
