<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Flex Image Gallery</h1>

        <div class="gallery">

            <div class="image-box">
                <img src="https://picsum.photos/id/1015/400/300" alt="">
            </div>

            <div class="image-box">
                <img src="https://picsum.photos/id/1016/400/300" alt="">
            </div>

            <div class="image-box">
                <img src="https://picsum.photos/id/1018/400/300" alt="">
            </div>

            <div class="image-box">
                <img src="https://picsum.photos/id/1020/400/300" alt="">
            </div>

            <div class="image-box">
                <img src="https://picsum.photos/id/1024/400/300" alt="">
            </div>

            <div class="image-box">
                <img src="https://picsum.photos/id/1035/400/300" alt="">
            </div>

        </div>
    </div>

</body>
</html>


<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    padding:40px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
}

.image-box{
    flex:1 1 300px;
    max-width:350px;
    overflow:hidden;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.image-box img{
    width:100%;
    height:250px;
    object-fit:cover;
    display:block;
    transition:0.4s;
}

.image-box:hover img{
    transform:scale(1.1);
}
</style>
